<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>img-optimizer — test console</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --good: #3fb950;
    --bad: #f85149;
    --warn: #d29922;
    --mono: "SF Mono", "JetBrains Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    line-height: 1.5;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    font-weight: 600;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    font-family: var(--mono);
    margin-bottom: 20px;
    padding: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--bad);
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .dot.connected { background: var(--good); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }

  .panel h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 12px;
    font-weight: 600;
  }

  .row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  label {
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  select, input[type="number"], input[type="file"] {
    background: #0d1117;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.85rem;
    font-family: inherit;
  }

  input[type="file"] {
    padding: 5px;
    max-width: 320px;
  }

  input[type="checkbox"] {
    accent-color: var(--accent);
  }

  .checkbox-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 0.85rem;
  }

  .checkbox-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text);
    cursor: pointer;
  }

  button {
    background: var(--accent);
    color: #0d1117;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  button:hover { opacity: 0.85; }
  button:disabled {
    background: var(--border);
    color: var(--text-dim);
    cursor: not-allowed;
  }

  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }

  /* Progress */
  .progress-track {
    height: 8px;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin: 10px 0 6px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  .progress-label {
    font-size: 0.8rem;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  /* Image results grid */
  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }

  .result-card {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-size: 0.78rem;
  }

  .result-card .name {
    font-weight: 600;
    margin-bottom: 6px;
    word-break: break-all;
    color: var(--text);
  }

  .result-card .row2 {
    display: flex;
    justify-content: space-between;
    color: var(--text-dim);
    margin-bottom: 2px;
  }

  .result-card .savings {
    color: var(--good);
    font-weight: 600;
  }

  .result-card a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.75rem;
  }

  /* Log */
  .log {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 0.75rem;
    max-height: 260px;
    overflow-y: auto;
    white-space: pre-wrap;
  }

  .log .entry { margin-bottom: 3px; }
  .log .t-ok { color: var(--good); }
  .log .t-err { color: var(--bad); }
  .log .t-info { color: var(--accent); }
  .log .t-warn { color: var(--warn); }
  .log .t-dim { color: var(--text-dim); }

  .zip-banner {
    display: none;
    margin-top: 12px;
    padding: 12px;
    background: rgba(63, 185, 80, 0.1);
    border: 1px solid var(--good);
    border-radius: 6px;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .zip-banner.show { display: flex; }

  .zip-banner .info { font-size: 0.85rem; }
  .zip-banner .info strong { color: var(--good); }

  .zip-banner a {
    background: var(--good);
    color: #0d1117;
    padding: 6px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  .heartbeat-indicator {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .heartbeat-indicator .pulse {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 5px;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .heartbeat-indicator .pulse.active { opacity: 1; }

  .session-id {
    font-family: var(--mono);
    color: var(--accent);
    font-size: 0.78rem;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>img-optimizer — test console</h1>
  <div class="subtitle">Single-file upload loop with realtime socket.io feedback</div>

  <div class="status-bar">
    <span class="dot" id="connDot"></span>
    <span id="connText">connecting…</span>
    <span id="sessionIdDisplay" class="session-id"></span>
    <span class="heartbeat-indicator">
      <span class="pulse" id="hbPulse"></span><span id="hbText">heartbeat: idle</span>
    </span>
  </div>

  <!-- Options panel -->
  <div class="panel">
    <h2>Options</h2>
    <div class="row">
      <div class="field">
        <label for="files">Images</label>
        <input type="file" id="files" multiple accept="image/jpeg,image/png,image/webp,image/tiff,image/gif">
      </div>
      <div class="field">
        <label for="format">Output format</label>
        <select id="format">
          <option value="webp">webp</option>
          <option value="jpeg">jpeg</option>
          <option value="png">png</option>
          <option value="tiff">tiff</option>
          <option value="gif">gif</option>
        </select>
      </div>
      <div class="field">
        <label for="quality">Quality (1–100)</label>
        <input type="number" id="quality" min="1" max="100" value="80" style="width: 80px;">
      </div>
      <div class="field">
        <label for="resizeWidth">Resize width (px, optional)</label>
        <input type="number" id="resizeWidth" min="1" placeholder="auto" style="width: 110px;">
      </div>
    </div>
    <div class="row" style="margin-top: 12px;">
      <div class="checkbox-row">
        <label><input type="checkbox" id="stripMetadata" checked> Strip metadata</label>
        <label><input type="checkbox" id="progressive" checked> Progressive</label>
        <label><input type="checkbox" id="lossless"> Lossless</label>
      </div>
    </div>
    <div class="row" style="margin-top: 14px;">
      <button id="startBtn">Start session &amp; upload</button>
      <button id="manualZipBtn" class="secondary" disabled>Request ZIP manually</button>
      <button id="resetBtn" class="secondary">Reset</button>
    </div>
  </div>

  <!-- Progress panel -->
  <div class="panel" id="progressPanel" style="display:none;">
    <h2>Progress</h2>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label" id="progressLabel">0 / 0</div>

    <div class="zip-banner" id="zipBanner">
      <div class="info">
        <strong>ZIP ready.</strong>
        <span id="zipStats"></span>
      </div>
      <a id="zipLink" href="#" target="_blank" rel="noopener">Download ZIP</a>
    </div>
  </div>

  <!-- Results panel -->
  <div class="panel" id="resultsPanel" style="display:none;">
    <h2>Results</h2>
    <div class="results-grid" id="resultsGrid"></div>
  </div>

  <!-- Log panel -->
  <div class="panel">
    <h2>Event log</h2>
    <div class="log" id="log"></div>
  </div>

</div>

<script>
  // ---- CONFIG ----
  const API_BASE = window.location.origin; // assumes served from same origin as backend
  // If testing from a different origin (e.g. opening this file directly),
  // change to: const API_BASE = 'http://localhost:3000';

  // ---- STATE ----
  let socket = null;
  let currentSessionId = null;
  let heartbeatTimer = null;
  let expectedFiles = 0;
  let completedFiles = 0;

  // ---- DOM ----
  const connDot = document.getElementById('connDot');
  const connText = document.getElementById('connText');
  const sessionIdDisplay = document.getElementById('sessionIdDisplay');
  const hbPulse = document.getElementById('hbPulse');
  const hbText = document.getElementById('hbText');
  const logEl = document.getElementById('log');
  const startBtn = document.getElementById('startBtn');
  const manualZipBtn = document.getElementById('manualZipBtn');
  const resetBtn = document.getElementById('resetBtn');
  const progressPanel = document.getElementById('progressPanel');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const resultsPanel = document.getElementById('resultsPanel');
  const resultsGrid = document.getElementById('resultsGrid');
  const zipBanner = document.getElementById('zipBanner');
  const zipLink = document.getElementById('zipLink');
  const zipStats = document.getElementById('zipStats');

  // ---- LOG ----
  function log(message, type = 'dim') {
    const entry = document.createElement('div');
    entry.className = `entry t-${type}`;
    const time = new Date().toLocaleTimeString();
    entry.textContent = `[${time}] ${message}`;
    logEl.appendChild(entry);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function formatBytes(bytes) {
    if (!bytes) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    let val = bytes;
    while (val >= 1024 && i < units.length - 1) {
      val /= 1024;
      i++;
    }
    return `${val.toFixed(val < 10 && i > 0 ? 1 : 0)} ${units[i]}`;
  }

  // ---- SOCKET SETUP ----
  function initSocket() {
    socket = io(API_BASE);

    socket.on('connect', () => {
      connDot.classList.add('connected');
      connText.textContent = `connected (${socket.id})`;
      log(`Socket connected: ${socket.id}`, 'ok');

      // If we already have a session (e.g. socket reconnected mid-batch), rejoin
      if (currentSessionId) {
        socket.emit('join-session', currentSessionId);
        log(`Rejoined session room ${currentSessionId}`, 'info');
      }
    });

    socket.on('disconnect', () => {
      connDot.classList.remove('connected');
      connText.textContent = 'disconnected';
      log('Socket disconnected', 'err');
    });

    socket.on('connect_error', (err) => {
      log(`Socket connection error: ${err.message}`, 'err');
    });

    socket.on('file-processed', ({ image, progress }) => {
      completedFiles = progress.completed;
      expectedFiles = progress.expected;

      log(
        `file-processed: ${image.originalName} → ${image.optimizedName} ` +
        `(${formatBytes(image.originalSize)} → ${formatBytes(image.optimizedSize)}, ` +
        `${image.savings}% smaller) [${progress.completed}/${progress.expected}]`,
        'ok'
      );

      updateProgress(progress.completed, progress.expected);
      addResultCard(image);
    });

    socket.on('file-error', ({ stage, originalName, message }) => {
      log(`file-error [${stage}]${originalName ? ' on ' + originalName : ''}: ${message}`, 'err');
    });

    socket.on('zip-ready', (data) => {
      log(
        `zip-ready: ${data.zipUrl} ` +
        `(total: ${formatBytes(data.totalOriginalSize)} → ${formatBytes(data.totalOptimizedSize)}, ` +
        `${data.totalSavings}% savings)`,
        'ok'
      );
      showZipBanner(data);
    });
  }

  // ---- HEARTBEAT ----
  function startHeartbeat(sessionId) {
    stopHeartbeat();
    hbText.textContent = 'heartbeat: active';
    heartbeatTimer = setInterval(() => {
      if (!socket || !socket.connected) return;
      socket.emit('heartbeat', sessionId);
      hbPulse.classList.add('active');
      log('heartbeat sent', 'dim');
      setTimeout(() => hbPulse.classList.remove('active'), 400);
    }, 30000);
  }

  function stopHeartbeat() {
    if (heartbeatTimer) {
      clearInterval(heartbeatTimer);
      heartbeatTimer = null;
    }
    hbText.textContent = 'heartbeat: idle';
    hbPulse.classList.remove('active');
  }

  // ---- UI HELPERS ----
  function updateProgress(completed, expected) {
    progressPanel.style.display = 'block';
    const pct = expected > 0 ? Math.round((completed / expected) * 100) : 0;
    progressFill.style.width = `${pct}%`;
    progressLabel.textContent = expected > 0
      ? `${completed} / ${expected} processed (${pct}%)`
      : `${completed} processed (expected count unknown)`;
  }

  function addResultCard(image) {
    resultsPanel.style.display = 'block';
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="name">${image.originalName}</div>
      <div class="row2"><span>Original</span><span>${formatBytes(image.originalSize)}</span></div>
      <div class="row2"><span>Optimized</span><span>${formatBytes(image.optimizedSize)}</span></div>
      <div class="row2"><span>Savings</span><span class="savings">${image.savings}%</span></div>
      <div class="row2"><span>Dimensions</span><span>${image.width}×${image.height}</span></div>
      <a href="${API_BASE}${image.downloadUrl}" target="_blank" rel="noopener">Download file →</a>
    `;
    resultsGrid.appendChild(card);
  }

  function showZipBanner(data) {
    zipBanner.classList.add('show');
    zipLink.href = `${API_BASE}${data.zipUrl}`;
    zipStats.textContent =
      `${formatBytes(data.totalOriginalSize)} → ${formatBytes(data.totalOptimizedSize)} (${data.totalSavings}% saved)`;
    manualZipBtn.disabled = true;
  }

  function resetUI() {
    progressPanel.style.display = 'none';
    resultsPanel.style.display = 'none';
    resultsGrid.innerHTML = '';
    progressFill.style.width = '0%';
    progressLabel.textContent = '0 / 0';
    zipBanner.classList.remove('show');
    sessionIdDisplay.textContent = '';
    manualZipBtn.disabled = true;
    completedFiles = 0;
    expectedFiles = 0;
    stopHeartbeat();
    if (currentSessionId && socket && socket.connected) {
      socket.emit('leave-session', currentSessionId);
      log(`Left session room ${currentSessionId}`, 'info');
    }
    currentSessionId = null;
    logEl.innerHTML = '';
    log('Reset', 'info');
  }

  // ---- MAIN FLOW ----
  async function startSessionAndUpload() {
    const fileInput = document.getElementById('files');
    const files = Array.from(fileInput.files || []);

    if (files.length === 0) {
      log('No files selected', 'warn');
      return;
    }

    startBtn.disabled = true;

    const options = {
      quality: Number(document.getElementById('quality').value) || 80,
      format: document.getElementById('format').value,
      stripMetadata: document.getElementById('stripMetadata').checked,
      progressive: document.getElementById('progressive').checked,
      lossless: document.getElementById('lossless').checked,
      totalFiles: files.length
    };

    const resizeWidth = Number(document.getElementById('resizeWidth').value);
    if (resizeWidth > 0) {
      options.resize = { width: resizeWidth };
    }

    log(`Starting session for ${files.length} file(s)...`, 'info');

    try {
      const startRes = await fetch(`${API_BASE}/api/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(options)
      });

      if (!startRes.ok) throw new Error(`/api/start failed: ${startRes.status}`);

      const { sessionId, folderName, expectedFiles: ef } = await startRes.json();
      currentSessionId = sessionId;
      expectedFiles = ef;

      sessionIdDisplay.textContent = `session: ${sessionId}`;
      log(`Session started: ${sessionId} (folder: ${folderName}, expecting ${ef} files)`, 'ok');

      // Join socket room for this session
      if (socket && socket.connected) {
        socket.emit('join-session', sessionId);
        log(`Joined session room ${sessionId}`, 'info');
      } else {
        log('Socket not connected — realtime events will be missed until reconnect', 'warn');
      }

      updateProgress(0, ef);
      manualZipBtn.disabled = false;
      startHeartbeat(sessionId);

      // Upload files one by one (single-file endpoint, looped client-side)
      for (const file of files) {
        const formData = new FormData();
        formData.append('image', file);
        formData.append('sessionId', sessionId);

        log(`Uploading ${file.name} (${formatBytes(file.size)})...`, 'dim');

        try {
          const uploadRes = await fetch(`${API_BASE}/api/upload`, {
            method: 'POST',
            body: formData
          });

          const data = await uploadRes.json();

          if (!uploadRes.ok) {
            log(`Upload failed for ${file.name}: ${data.error || uploadRes.status}`, 'err');
            continue;
          }

          // Note: result also arrives via 'file-processed' socket event.
          // We rely on the socket event for UI updates to avoid duplicates.
          log(`HTTP response OK for ${file.name}`, 'dim');
        } catch (err) {
          log(`Upload request error for ${file.name}: ${err.message}`, 'err');
        }
      }

      log('All upload requests sent.', 'info');
    } catch (err) {
      log(`Error: ${err.message}`, 'err');
    } finally {
      startBtn.disabled = false;
    }
  }

  async function requestZipManually() {
    if (!currentSessionId) return;
    log('Requesting ZIP manually...', 'info');
    try {
      const res = await fetch(`${API_BASE}/api/zip/${currentSessionId}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `status ${res.status}`);

      log(`Manual ZIP response: ${data.zipUrl}`, 'ok');
      showZipBanner({
        zipUrl: data.zipUrl,
        totalOriginalSize: data.totalOriginalSize,
        totalOptimizedSize: data.totalOptimizedSize,
        totalSavings: data.totalSavings
      });
    } catch (err) {
      log(`Manual ZIP error: ${err.message}`, 'err');
    }
  }

  // ---- WIRE UP ----
  startBtn.addEventListener('click', startSessionAndUpload);
  manualZipBtn.addEventListener('click', requestZipManually);
  resetBtn.addEventListener('click', resetUI);

  initSocket();
  log('Initializing... waiting for socket connection', 'dim');
</script>
</body>
</html>
